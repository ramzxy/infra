---
- name: Install Docker Engine (official script)
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://get.docker.com | sh  # noqa: command-instead-of-module
  args:
    executable: /bin/bash
    creates: /usr/bin/docker

# "ip": "127.0.0.1" makes `-p 8080:80` bind to localhost by default.
# Without it, Docker opens published ports to the internet and walks right past ufw.
- name: Docker daemon config
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "ip": "127.0.0.1",
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    mode: "0644"
  notify: Restart docker

- name: Docker running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Admin user can use docker without sudo
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true
