---
- name: Config folders
  ansible.builtin.file:
    path: "{{ admin_home }}/{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  loop:
    - .config
    - .config/oh-my-posh
    - .config/git
    - .cache
    - .tmux
    - .tmux/plugins

# On a box that already had its own dotfiles, keep them as <file>.pre-infra before overwriting.
# grep exits 0 = ours, 1 = someone else's, 2 = no file yet.
- name: Look for dotfiles this repo didn't write
  ansible.builtin.command: grep -q "Managed by Ansible" "{{ admin_home }}/{{ item }}"
  loop: [.zshrc, .zshenv, .tmux.conf]
  register: shell_dotfile_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Keep a copy of them
  ansible.builtin.copy:
    src: "{{ admin_home }}/{{ item.item }}"
    dest: "{{ admin_home }}/{{ item.item }}.pre-infra"
    remote_src: true
    force: false
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  loop: "{{ shell_dotfile_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 1

- name: Dotfiles for the admin user
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ admin_home }}/{{ item.dest }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
  loop:
    - { src: zshenv.j2, dest: .zshenv }
    - { src: zshrc.j2, dest: .zshrc }
    - { src: tmux.conf.j2, dest: .tmux.conf }
    - { src: gitconfig.j2, dest: .config/git/config }

# Same theme as the Windows PowerShell prompt, plus user@host when you're in over SSH.
- name: Prompt theme
  ansible.builtin.copy:
    src: theme.omp.json
    dest: "{{ admin_home }}/.config/oh-my-posh/theme.omp.json"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"

# TPM updates them afterwards (prefix + U), so Ansible only does the first clone.
- name: Tmux plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ admin_home }}/.tmux/plugins/{{ item.name }}"
    depth: 1
    update: false  # noqa: latest[git]
  become: true
  become_user: "{{ admin_user }}"
  loop: "{{ tmux_plugins }}"
  loop_control:
    label: "{{ item.name }}"

- name: Keep a place for personal, unmanaged shell tweaks
  ansible.builtin.file:
    path: "{{ admin_home }}/.zshrc.local"
    state: touch
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0644"
    modification_time: preserve
    access_time: preserve
